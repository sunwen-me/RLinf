defaults:
  - env/robocasa_opendrawer@env.train
  - env/robocasa_opendrawer@env.eval
  - model/xr1@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "/root/work/results/grpo_opendrawer_run5"
    project_name: rlinf
    experiment_name: "grpo_opendrawer_run10"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 1000
  # run10 resumes run8 at global_step 50 -- the same start as run9, at the same
  # horizon, so the two differ only in the reward-filter band below and are a
  # controlled A/B on it.  embodied_runner recovers the step counter by parsing
  # the resume_dir name, so max_steps must be the *absolute* target: 100 ==
  # another 50 gradient steps.  Leaving it at 50 would make the loop exit
  # immediately (50 >= max_steps).  run8 took 7 h 27 m for 50 steps.
  max_steps: 100

  only_eval: False
  # -1 skips building the eval envs entirely (enable_eval = val_check_interval
  # > 0 or only_eval); each RoboCasa env is a 6-10 GB MuJoCo subprocess.
  val_check_interval: -1
  # Keep exactly one checkpoint, the last.  The loop starts at 51, so the only
  # step in range that satisfies check_progress's divisibility test is 100 --
  # also is_train_end.  Costs 21 GB: 11 GB of model+optimizer DCP
  # shards for resume plus 11 GB of consolidated full_weights.pt for standalone
  # eval.  run6 and run7 each raised success_once by ~0.23 over 47 steps and
  # then discarded the improved policy, because check_progress computes
  # save_model &= (save_interval > 0) -- so -1 suppresses the is_train_end save
  # too, not just the intermediate ones.
  save_interval: 50

  # Continue run8's policy *and* optimizer state.  All three 50-step runs only
  # began rising after step ~36 and run7 was still climbing at its cutoff
  # (step 50 = 0.828, its own high), so 50 steps cannot tell a plateau from a
  # truncated ascent.  Resuming is strictly better than one 100-step run here:
  # the step-50 weights are already banked, and this box has restarted a
  # container mid-run before.
  resume_dir: /root/work/results/grpo_opendrawer_run5/grpo_opendrawer_run8/checkpoints/global_step_50
  ckpt_path: null  # Optional: path to a .pt checkpoint. If not None, it will be loaded after the model is instantiated (for evaluation).

algorithm:
  normalize_advantages: True
  kl_penalty: kl  # how to estimate kl divergence: kl or kl_penalty
  group_size: 8
  reward_coef: 1.0

  reward_type: chunk_level
  # token_level: per-dim PPO ratio. chunk_level sums num_action_chunks*action_dim
  # (10*7=70) Gaussian logprobs into one number, so the rollout-vs-training
  # logprob noise hits the ratio amplified by sqrt(70): measured at 0.108 on
  # frozen actor weights, i.e. 54% of the clip range, clipping ~8% of the batch
  # before the policy has moved at all (see
  # tests/unit_tests/test_embodied_logprob_granularity.py). Same choice, same
  # reason as libero_spatial_grpo_evo1.yaml (14*7 dims) and the lingbotvla
  # configs (50 chunks).
  logprob_type: token_level
  entropy_type: token_level

  update_epoch: 2
  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 1.0
  gae_lambda: 0.95

  # Drop groups that are all-fail or all-success: GRPO gives them exactly zero
  # advantage, so they contribute only ratio noise. On in every other GRPO
  # recipe in this repo.
  #
  # The bounds are compared against the episode-summed *return*, not a success
  # rate, and this recipe terminates the episode on success (env/
  # robocasa_opendrawer sets ignore_terminations: False), so one success returns
  # reward_coef + progress_coef*dprogress ~= 1.2 and one failure ~= 0.14: a
  # group of eight with k successes has mean return ~= 0.1325k + 0.14.  The
  # inherited [0.1, 0.9] therefore drops every group at k >= 6 and no group at
  # k = 0 -- backwards on both ends.  At run8's step-50 success of 0.68 that is
  # P(k >= 6) = 0.50 of the batch thrown away, and it tightens as the policy
  # improves, which is the self-limiting ceiling that run9 plateaued against
  # (its step-99 return of 1.011 put *every* group out of band: the whole step
  # was masked, logged advantages_mean=nan, and applied no gradient).
  # [0.2, 1.15] brackets the same intent in return units: only k = 8 (1.2) and
  # k = 0 (0.14) fall out, which are exactly the two zero-variance groups.
  filter_rewards: True
  rewards_lower_bound: 0.2
  rewards_upper_bound: 1.15

env:
  group_name: "EnvGroup"
  enable_offload: False

  # Override the defaults in env/robocasa_opendrawer: XR-1 consumes three
  # 256x256 views, the 7D end-effector action space, and a 32D state vector
  # whose last seven entries are the raw arm joint positions.
  train:
    # Host RAM, not GPU memory, caps total_num_envs on this 115 GB box: every
    # RoboCasa env is its own MuJoCo subprocess at 6-10 GB RSS and 16 envs gets
    # Ray-OOM-killed. rollout_epoch is nearly free (one obs per 10-action
    # chunk), so 8 x 8 buys 64 episodes per gradient step instead of 8.
    rollout_epoch: 8
    total_num_envs: 8
    # TurnOnStove success is a cliff in the horizon: measured success_once is
    # 0.359 over 3000 episodes at 200 steps, which is where within-group reward
    # variance -- and therefore any GRPO advantage at all -- actually exists.
    max_episode_steps: 200
    max_steps_per_rollout_epoch: 200
    group_size: ${algorithm.group_size}
    reward_coef: ${algorithm.reward_coef}
    # Turn on the continuous task-progress potential (rlinf/envs/robocasa/
    # task_progress.py).  Every run before this one optimised the bare success
    # bit, so inside a GRPO group all eight failures scored an identical 0 and
    # the advantage said nothing about which attempt got closest.  0.2 copies
    # the dense:terminal mass ratio of the repo's only other embodied dense
    # reward, the staged ManiSkill one (two 0.1 milestones against a 1.0
    # success) in rlinf/envs/maniskill/maniskill_env.py.
    progress_coef: 0.2
    action_space: 7d
    state_space: 32d
    image_space: 3views
    include_joint_state: True
    init_params:
      camera_heights: 256
      camera_widths: 256
    video_cfg:
      save_video: False
      info_on_video: True
      video_base_dir: ${runner.logger.log_path}/video/train

  eval:
    rollout_epoch: 1
    total_num_envs: 16
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 500
    max_steps_per_rollout_epoch: 500
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    is_eval: True
    action_space: 7d
    state_space: 32d
    image_space: 3views
    include_joint_state: True
    init_params:
      camera_heights: 256
      camera_widths: 256
    video_cfg:
      save_video: True
      info_on_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_type: ${actor.model.model_type}
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 8
  # One rollout batch is total_num_envs x rollout_epoch x
  # max_steps_per_rollout_epoch / num_action_chunks = 8 x 8 x 20 = 1280 samples.
  # 640 is the value the PPO run measured as stable on this box (ratio_abs
  # 0.11-0.15), i.e. 2 optimizer steps per update epoch, 4 per train step.
  global_batch_size: 640
  seed: 42
  enable_offload: False

  # Override the defaults in model/xr1
  model:
    model_path: "/root/work/ckpt/Xiaomi-Robotics-1-RoboCasa"
    num_action_chunks: 10
    num_steps: 5
    action_dim: 7
    add_value_head: False
    # run5 trained the whole action expert (615.3M / 5.05B) with no anchor of
    # any kind -- kl_beta 0, entropy_bonus 0, and grad_norm ~0.22 against
    # clip_grad 10 -- and drifted off the SFT manifold: success rose from 0.328
    # to 0.531 by step 13 and then fell to 0.156 by step 43. The reference GRPO
    # recipe in maniskill_grpo_openvlaoft.yaml constrains the update with LoRA
    # instead, so run6 does the same. The regex keeps the adapters inside the
    # DiT (180 linears over 36 blocks, 24.8M parameters = 1/25 of run5) and out
    # of the frozen Qwen3-VL backbone, which the shared suffix list would have
    # adapted; it also has to name qkv_proj explicitly, which that list misses.
    # Verified by tests/unit_tests/test_lora_target_scoping.py.
    is_lora: True
    lora_rank: 32
    lora_target_modules: '.*dit\..*(qkv_proj|o_proj|gate_proj|up_proj|down_proj)'
    # Selects the RoboCasa action-space mapping in
    # rlinf/envs/action_utils.py::prepare_actions_for_robocasa. The remaining
    # env action dimensions (base, torso, base_mode) are filled from
    # ROBOCASA_DEFAULT_ACTION, which keeps base_mode at -1 (fixed base).
    policy_setup: ${env.train.action_space}

    xr1:
      robot_type: "robocasa_mg"
      image_size: 256
      max_prompt_length: 320
      state_indices: [25, 26, 27, 28, 29, 30, 31, 7]
      noise_method: "flow_sde"
      noise_level: 0.5
      joint_logprob: False

  optim:
    # 5.0e-6 is the flow-matching VLA learning rate across this repo (openpi,
    # openpi-pi05, gr00t, dexbotic-pi0, evo1); the earlier 1.0e-5 was 2x that
    # with nothing measured behind it.
    # Third point on the lr ladder, bracketed by two measured runs on this exact
    # config: 5.0e-6 (grpo2, 50 steps) is flat -- success 0.3691, first25-vs-last25
    # p 0.93 -- with only 0.2-0.5% of dims clipped, i.e. the policy barely moves.
    # 5.0e-5 (grpo3, 16 steps) degrades it -- success 0.2920, 4 SE below grpo2 --
    # with 9-14% clipped. 2.0e-5 is the geometric middle and the only untested
    # point with a reason behind it.
    # maniskill_grpo_openvlaoft.yaml -- the reference GRPO recipe, and the only
    # one in this repo that trains through LoRA -- pairs is_lora with lr 1.0e-4.
    # run5 unconstrained at 2.0e-5 both improved and then collapsed, so the lr
    # is not the binding problem; a rank-32 subspace at 2.0e-5 would most likely
    # just read out flat. The step-5 mechanism gate in PREREG_run6.md catches
    # the case where this is still too small to move the policy.
    lr: 1.0e-4
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    clip_grad: 1.0
    weight_decay: 0.01
    critic_warmup_steps: 0

  # Override the defaults in hybrid_engines/fsdp
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    # MiBoTForActionGeneration sets supports_gradient_checkpointing = False, and
    # with rl_trainable_scope="action_expert" the VLM prefix already runs under
    # torch.no_grad(), so checkpointing would buy nothing.
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
