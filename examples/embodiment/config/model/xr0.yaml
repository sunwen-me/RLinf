# XR0 VLA model config for RLinf.
# XR0: Qwen3-VL backbone + DiT action head with rectified flow.

model_type: "xr0"

# Path to XR0 checkpoint (set to "dummy" for skeleton/testing without weights)
model_path: "dummy"

# Precision used by RLinf actor/rollout wrappers
precision: "bf16"

# Action/chunk settings
# NOTE: action_mask from processor has shape (1, 10, 32), so model outputs
# 10 timesteps. Xiaomi eval uses replan_steps=10 matching this.
action_dim: 32
num_action_chunks: 10
num_steps: 5

# Environment action dimension: slice model output to this many dims
# before returning to env.  XR0 outputs 32D (bimanual) but LIBERO
# expects 7D (right arm: ee_pos:3 + ee_aa:3 + gripper:1).
action_env_dim: 7

# No action_mapping needed for LIBERO -- default slicing [:, :7] matches
# the Xiaomi eval code (action_chunk[:, 0:7] = left arm ee_pos+aa+gripper).

# LoRA settings (disabled by default)
is_lora: False
lora_rank: 32

# Common embodied fields
use_proprio: True

# RL head behavior
# For GRPO actor-only this can stay False; for PPO actor_critic set to True
add_value_head: False

# Optional flags
trust_remote_code: True
low_cpu_mem_usage: True

# Action normalization stats: model outputs normalized actions, must denormalize.
# Extracted from processor.action_config["libero_all"] mean/std.
stats_path: "/mnt/ls/Xiaomi-Robotics-0-LIBERO/action_stats.yaml"
unnorm_key: null

# Flow-matching noise level for RL training (higher = more exploration)
# 0.5 was too high (arm twitching); 0.05 gives mild exploration.
noise_level: 0.05

# Freeze VLM backbone, only train DiT + projectors (~270M out of 4.7B)
# Prevents pretrained knowledge degradation during RL fine-tuning
train_expert_only: True

# XR0-specific config
xr0:
  state_shape: [1, 32]  # Model expects 32D (LIBERO 8D state is padded via _pad_state)
  action_shape: [30, 32]
  dit_num_layers: 16
  dit_hidden_size: 1024
  local_window: 4
  async_train: false  # Enable for async RL training (prefix-based partial replay)
  training_repeat: 1  # Batch augmentation (supervised pretraining only)
  freq_coefficient: 0.0  # Frequency-domain loss weight (0 = disabled)
  enable_freq: false
  flow_sampling: "beta"
