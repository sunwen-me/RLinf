defaults:
  - env/robocasa_closedrawer@env.train
  - env/robocasa_closedrawer@env.eval
  - model/xr1@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/embodiment/config

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-1

runner:
  task_type: embodied
  logger:
    log_path: "../results/robocasa_grpo_xr1"
    project_name: rlinf
    experiment_name: "test_xr1"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 1
  max_steps: -1

  only_eval: False
  ckpt_path: null  # Optional: .pt file or None, if None, will use the checkpoint in rollout.model.model_path

  val_check_interval: -1
  save_interval: -1

  resume_dir: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl  # how to estimate kl divergence: kl or kl_penalty
  group_size: 2
  reward_coef: 1.0

  reward_type: chunk_level
  # token_level: per-dim PPO ratio. chunk_level sums num_action_chunks*action_dim
  # (10*7=70) Gaussian logprobs into one number, so the rollout-vs-training
  # logprob noise hits the ratio amplified by sqrt(70): measured at 0.108 on
  # frozen actor weights, i.e. 54% of the clip range, clipping ~8% of the batch
  # before the policy has moved at all (see
  # tests/unit_tests/test_embodied_logprob_granularity.py). Same choice, same
  # reason as libero_spatial_grpo_evo1.yaml (14*7 dims) and the lingbotvla
  # configs (50 chunks).
  logprob_type: token_level
  entropy_type: token_level

  update_epoch: 1
  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 1.0
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"
  enable_offload: False

  # XR-1 consumes three 256x256 views, the 7D end-effector action space, and a
  # 32D state vector whose last seven entries are the raw arm joint positions.
  # max_steps_per_rollout_epoch must stay a multiple of num_action_chunks (10).
  train:
    rollout_epoch: 1
    total_num_envs: 4
    max_episode_steps: 10
    max_steps_per_rollout_epoch: 10
    group_size: ${algorithm.group_size}
    reward_coef: ${algorithm.reward_coef}
    action_space: 7d
    state_space: 32d
    image_space: 3views
    include_joint_state: True
    init_params:
      camera_heights: 256
      camera_widths: 256

  eval:
    rollout_epoch: 1 # set eval.rollout_epoch > 0 when enable runner.only_eval or runner.val_check_interval > 0
    total_num_envs: 4
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 10
    max_steps_per_rollout_epoch: 10
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    is_eval: True
    action_space: 7d
    state_space: 32d
    image_space: 3views
    include_joint_state: True
    init_params:
      camera_heights: 256
      camera_widths: 256

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_type: ${actor.model.model_type}
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 2
  global_batch_size: 4
  seed: 42
  enable_offload: False

  model:
    model_path: "/workspace/dataset/Xiaomi-Robotics-1-RoboCasa"
    num_action_chunks: 10
    num_steps: 5
    action_dim: 7
    add_value_head: False
    policy_setup: ${env.train.action_space}

    xr1:
      robot_type: "robocasa_mg"
      image_size: 256
      max_prompt_length: 320
      state_indices: [25, 26, 27, 28, 29, 30, 31, 7]
      noise_method: "flow_sde"
      noise_level: 0.5
      joint_logprob: False

  optim:
    # 5.0e-6 is the flow-matching VLA learning rate across this repo (openpi,
    # openpi-pi05, gr00t, dexbotic-pi0, evo1); the earlier 1.0e-5 was 2x that
    # with nothing measured behind it.
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    clip_grad: 1.0
    weight_decay: 0.01
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    gradient_checkpointing: False # MiBoT sets supports_gradient_checkpointing = False, please do not change this value
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
