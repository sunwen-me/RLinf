defaults:
  - env/robocasa_closedrawer@env.eval
  - model/xr1@rollout.model
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: 0-1

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results/robocasa_closedrawer_xr1_eval"
    project_name: rlinf
    experiment_name: "test_robocasa_closedrawer_xr1_eval"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  max_steps: -1

  only_eval: True
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"

  # XR-1 consumes three 256x256 views, the 7D end-effector action space, and a
  # 32D state vector whose last seven entries are the raw arm joint positions.
  # max_steps_per_rollout_epoch must stay a multiple of num_action_chunks (10).
  eval:
    rollout_epoch: 1
    total_num_envs: 4
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 10
    max_steps_per_rollout_epoch: 10
    group_size: 1
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    is_eval: True
    action_space: 7d
    state_space: 32d
    image_space: 3views
    include_joint_state: True
    init_params:
      camera_heights: 256
      camera_widths: 256
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1

  # In eval-only mode the env and rollout workers read `rollout.model`, so this
  # block carries the full model config.
  model:
    model_path: "/workspace/dataset/Xiaomi-Robotics-1-RoboCasa"
    add_value_head: False
    policy_setup: ${env.eval.action_space}
